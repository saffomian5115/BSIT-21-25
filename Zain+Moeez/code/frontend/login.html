<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FourWheels — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --surface: #111113;
      --card: #18181c;
      --border: #2a2a30;
      --accent: #e8390e;
      --accent-glow: rgba(232,57,14,0.25);
      --text: #f0f0f0;
      --muted: #6b6b75;
      --input-bg: #0f0f12;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      overflow-x: hidden;
    }

    /* Left Panel */
    .panel-left {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--surface);
    }

    .panel-left::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 60%, rgba(232,57,14,0.18) 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, var(--border) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, var(--border) 40px);
      opacity: 0.6;
    }

    .brand-block {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
    }

    .brand-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: 0.05em;
      line-height: 1;
      color: var(--text);
      text-shadow: 0 0 60px var(--accent-glow);
    }

    .brand-logo span { color: var(--accent); }

    .brand-tagline {
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.75rem;
    }

    .decor-line {
      width: 60px;
      height: 3px;
      background: var(--accent);
      margin: 1.5rem auto;
      border-radius: 2px;
      box-shadow: 0 0 16px var(--accent);
    }

    /* Animated car graphic */
    .car-graphic {
      margin-top: 2.5rem;
      font-size: 5rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(232,57,14,0.4));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .stat-row {
      display: flex;
      gap: 2rem;
      margin-top: 2rem;
      justify-content: center;
    }

    .stat { text-align: center; }
    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: var(--accent);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    /* Right Panel */
    .panel-right {
      width: 440px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2.5rem;
      background: var(--card);
      border-left: 1px solid var(--border);
      animation: slideIn 0.6s cubic-bezier(0.22,1,0.36,1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .form-wrapper { width: 100%; }

    .form-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.8rem;
      letter-spacing: 0.04em;
      line-height: 1;
      margin-bottom: 0.4rem;
    }

    .form-subtitle {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    .form-subtitle a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .form-subtitle a:hover { text-decoration: underline; }

    .field {
      margin-bottom: 1.2rem;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
      font-weight: 500;
    }

    .field-wrap {
      position: relative;
    }

    .field input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .field input::placeholder { color: var(--muted); }

    .field input.error { border-color: #e83e3e; }

    .toggle-pass {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--muted);
      font-size: 0.8rem;
      user-select: none;
      transition: color 0.2s;
    }

    .toggle-pass:hover { color: var(--text); }

    .err-msg {
      font-size: 0.75rem;
      color: #e83e3e;
      margin-top: 0.3rem;
      display: none;
    }

    .forgot-link {
      text-align: right;
      margin-top: -0.6rem;
      margin-bottom: 1.5rem;
    }

    .forgot-link a {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link a:hover { color: var(--accent); }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background: #c72e08;
      box-shadow: 0 0 24px var(--accent-glow);
    }

    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

    .btn-submit .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .register-cta {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .register-cta a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .register-cta a:hover { text-decoration: underline; }

    .toast {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      color: var(--text);
      padding: 1rem 1.25rem;
      border-radius: 8px;
      font-size: 0.88rem;
      z-index: 9999;
      opacity: 0;
      transform: translateY(-12px);
      transition: all 0.3s;
      max-width: 320px;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-left-color: #22c55e; }
    .toast.error   { border-left-color: #e83e3e; }

    @media (max-width: 820px) {
      .panel-left { display: none; }
      .panel-right { width: 100%; border-left: none; }
    }

    @media (max-width: 480px) {
      .panel-right { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- Left Branding Panel -->
  <div class="panel-left">
    <div class="brand-block">
      <div class="brand-logo">Four<span>Wheels</span></div>
      <div class="brand-tagline">Pakistan's Vehicle Marketplace</div>
      <div class="decor-line"></div>
      <div class="car-graphic">🚗</div>
      <div class="stat-row">
        <div class="stat">
          <div class="stat-num">5K+</div>
          <div class="stat-label">Listings</div>
        </div>
        <div class="stat">
          <div class="stat-num">12K+</div>
          <div class="stat-label">Users</div>
        </div>
        <div class="stat">
          <div class="stat-num">50+</div>
          <div class="stat-label">Cities</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Form Panel -->
  <div class="panel-right">
    <div class="form-wrapper">
      <div class="form-title">Welcome Back</div>
      <p class="form-subtitle">New here? <a href="register.html">Create an account</a></p>

      <form id="loginForm" novalidate>

        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="your@email.com" autocomplete="email"/>
          <div class="err-msg" id="emailErr">Enter a valid email address</div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="field-wrap">
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password"/>
            <span class="toggle-pass" id="togglePass">SHOW</span>
          </div>
          <div class="err-msg" id="passwordErr">Password is required</div>
        </div>

        <div class="forgot-link">
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span id="btnText">Sign In</span>
          <div class="spinner" id="spinner"></div>
        </button>

        <div class="divider">or</div>

        <div class="register-cta">
          Don't have an account? <a href="register.html">Register Now</a>
        </div>

      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    const API = 'http://localhost:5000/api';

    // Show/hide password
    const passInput  = document.getElementById('password');
    const toggleBtn  = document.getElementById('togglePass');

    toggleBtn.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      toggleBtn.textContent = isPass ? 'HIDE' : 'SHOW';
    });

    // Toast helper
    function showToast(msg, type = 'error') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    // Validate
    function validate() {
      let valid = true;

      const emailVal = document.getElementById('email').value;
      const passVal  = document.getElementById('password').value;

      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal);
      const passOk  = passVal.length > 0;

      document.getElementById('email').classList.toggle('error', !emailOk);
      document.getElementById('emailErr').style.display = emailOk ? 'none' : 'block';

      document.getElementById('password').classList.toggle('error', !passOk);
      document.getElementById('passwordErr').style.display = passOk ? 'none' : 'block';

      if (!emailOk || !passOk) valid = false;
      return valid;
    }

    // Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validate()) return;

      const btn     = document.getElementById('submitBtn');
      const txt     = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');

      btn.disabled = true;
      txt.style.display = 'none';
      spinner.style.display = 'block';

      const payload = {
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res  = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('fw_token', data.token);
          localStorage.setItem('fw_user',  JSON.stringify(data.user));
          showToast('Login successful! Redirecting…', 'success');

          setTimeout(() => {
            const role = data.user.role;
            if (role === 'admin')  window.location.href = 'admin-dashboard.html';
            else if (role === 'seller') window.location.href = 'seller-dashboard.html';
            else window.location.href = 'index.html';
          }, 1200);
        } else {
          showToast(data.message || 'Login failed', 'error');
          btn.disabled = false;
          txt.style.display = 'block';
          spinner.style.display = 'none';
        }
      } catch (err) {
        showToast('Cannot connect to server', 'error');
        btn.disabled = false;
        txt.style.display = 'block';
        spinner.style.display = 'none';
      }
    });

    // Already logged in? Redirect
    if (localStorage.getItem('fw_token')) {
      const user = JSON.parse(localStorage.getItem('fw_user') || '{}');
      if (user.role === 'admin') window.location.href = 'admin-dashboard.html';
      else if (user.role === 'seller') window.location.href = 'seller-dashboard.html';
      else if (user.role) window.location.href = 'index.html';
    }
  </script>
</body>
</html>
