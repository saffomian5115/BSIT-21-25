<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FourWheels — Vehicle Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0b;
      --surface: #111113;
      --card: #18181c;
      --border: #2a2a30;
      --accent: #e8390e;
      --accent-glow: rgba(232, 57, 14, 0.25);
      --text: #f0f0f0;
      --muted: #6b6b75;
      --input-bg: #0f0f12;
      --success: #22c55e;
      --warning: #f59e0b;
      --star: #f59e0b;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== NAV ===== */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.05em;
      color: var(--text);
      text-decoration: none;
    }

    .nav-logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-links a {
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-logout {
      font-size: 0.8rem;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-logout:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== BREADCRUMB ===== */
    .breadcrumb {
      padding: 1rem 2rem;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .breadcrumb a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .breadcrumb a:hover {
      color: var(--accent);
    }

    .breadcrumb span {
      color: var(--text);
    }

    /* ===== MAIN LAYOUT ===== */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2rem;
    }

    /* ===== GALLERY ===== */
    .gallery {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .gallery-main {
      position: relative;
      width: 100%;
      height: 420px;
      background: #0d0d10;
      overflow: hidden;
    }

    .gallery-main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s;
    }

    .gallery-main .no-image {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      color: var(--muted);
    }

    .gallery-main .no-image span {
      font-size: 4rem;
    }

    .gallery-main .no-image p {
      font-size: 0.9rem;
    }

    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 1rem;
      pointer-events: none;
    }

    .gallery-nav button {
      pointer-events: all;
      background: rgba(10, 10, 11, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
    }

    .gallery-nav button:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .img-counter {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      background: rgba(10, 10, 11, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.3rem 0.8rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .gallery-thumbs {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem;
      overflow-x: auto;
      background: var(--surface);
    }

    .gallery-thumbs::-webkit-scrollbar {
      height: 4px;
    }

    .gallery-thumbs::-webkit-scrollbar-track {
      background: var(--border);
    }

    .gallery-thumbs::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 2px;
    }

    .thumb {
      width: 72px;
      height: 54px;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
      transition: border-color 0.2s, opacity 0.2s;
      opacity: 0.6;
    }

    .thumb:hover,
    .thumb.active {
      border-color: var(--accent);
      opacity: 1;
    }

    /* ===== 3D VIEWER ===== */
    .viewer-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .viewer-title {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .viewer-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .badge-3d {
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .viewer-tip {
      font-size: 0.73rem;
      color: var(--muted);
    }

    #viewer-canvas {
      width: 100%;
      height: 340px;
      display: block;
      background: radial-gradient(ellipse at center, #1a1a22 0%, #0a0a0b 100%);
    }

    .viewer-controls {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      align-items: center;
    }

    .ctrl-btn {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }



    .ctrl-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .ctrl-btn.active {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: var(--accent);
    }

    .ctrl-label {
      margin-left: auto;
      font-size: 0.73rem;
      color: var(--muted);
    }

    /* ===== FULLSCREEN VIEWER ===== */
    #fsOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: #0a0a0b;
      flex-direction: column;
    }

    #fsOverlay.active {
      display: flex;
    }

    #fs-canvas {
      flex: 1;
      display: block;
      width: 100%;
      cursor: grab;
    }

    #fs-canvas:active {
      cursor: grabbing;
    }

    /* Controls float over canvas */
    .fs-controls {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: rgba(17, 17, 19, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 40px;
      flex-wrap: nowrap;
      white-space: nowrap;
      z-index: 10;
    }

    .fs-close-btn {
      background: rgba(232, 57, 14, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .fs-close-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    #previewCanvas {
      width: 100%;
      height: 340px;
      display: block;
      cursor: pointer;
    }

    .preview-hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.5rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      letter-spacing: 0.05em;
    }

    /* Preview BG toggle btn */
    .preview-bg-btn {
      position: absolute;
      top: 0.6rem;
      right: 0.6rem;
      background: rgba(17, 17, 19, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 5;
    }

    .preview-bg-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== VEHICLE INFO ===== */
    .info-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .veh-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    .veh-status.approved {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: var(--success);
    }

    .veh-status.pending {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--warning);
    }

    .veh-status.rejected {
      background: rgba(232, 62, 62, 0.12);
      border: 1px solid rgba(232, 62, 62, 0.3);
      color: #e83e3e;
    }

    .veh-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      letter-spacing: 0.04em;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .veh-price {
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 1.25rem;
    }

    .veh-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .meta-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.83rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
    }

    .meta-chip .icon {
      font-size: 0.95rem;
    }

    .section-label {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .veh-description {
      font-size: 0.9rem;
      color: #c0c0cc;
      line-height: 1.7;
    }

    .stats-row {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .stat-box {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem;
      text-align: center;
    }

    .stat-box .num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      color: var(--accent);
    }

    .stat-box .lbl {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ===== REVIEWS SECTION ===== */
    .reviews-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .reviews-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .reviews-header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.05em;
    }

    .reviews-header-title span {
      color: var(--accent);
    }

    /* Average rating summary */
    .rating-summary {
      display: flex;
      gap: 2rem;
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .rating-big {
      text-align: center;
      flex-shrink: 0;
    }

    .rating-big .num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 4rem;
      line-height: 1;
      color: var(--star);
    }

    .rating-big .stars {
      display: flex;
      gap: 2px;
      justify-content: center;
      margin-top: 0.25rem;
    }

    .rating-big .count {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .rating-bars {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .rating-bar-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .bar-track {
      flex: 1;
      height: 6px;
      background: var(--surface);
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--star);
      border-radius: 3px;
      transition: width 0.8s ease;
    }

    .bar-count {
      min-width: 20px;
      text-align: right;
    }

    /* Star rating input */
    .star-input {
      display: flex;
      gap: 0.25rem;
      flex-direction: row-reverse;
      justify-content: flex-end;
    }

    .star-input input {
      display: none;
    }

    .star-input label {
      font-size: 1.6rem;
      color: var(--border);
      cursor: pointer;
      transition: color 0.15s;
    }

    .star-input label:hover,
    .star-input label:hover~label,
    .star-input input:checked~label {
      color: var(--star);
    }

    /* Review cards */
    .review-list {
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .review-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .review-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .reviewer-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .reviewer-avatar {
      width: 36px;
      height: 36px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      color: var(--accent);
      flex-shrink: 0;
    }

    .reviewer-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .reviewer-meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .review-stars {
      display: flex;
      gap: 2px;
    }

    .star {
      font-size: 0.9rem;
    }

    .star.filled {
      color: var(--star);
    }

    .star.empty {
      color: var(--border);
    }

    .review-date {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .review-comment {
      font-size: 0.88rem;
      color: #c0c0cc;
      line-height: 1.6;
    }

    .review-delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .review-delete-btn:hover {
      color: #e83e3e;
      background: rgba(232, 62, 62, 0.08);
    }

    .reviews-empty {
      text-align: center;
      padding: 2.5rem;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .reviews-empty .icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      opacity: 0.4;
    }

    .reviews-load-more {
      text-align: center;
      padding: 1rem;
      border-top: 1px solid var(--border);
    }

    .btn-load-more {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.55rem 1.5rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-load-more:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Write review form */
    .write-review-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .write-review-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }

    .write-review-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }

    .field textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: none;
    }

    .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .field textarea::placeholder {
      color: var(--muted);
    }

    /* ===== RIGHT COLUMN ===== */
    .seller-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .seller-card-title {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .seller-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .seller-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent-glow);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      color: var(--accent);
      flex-shrink: 0;
    }

    .seller-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .seller-since {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    /* Seller rating display */
    .seller-rating-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.3rem;
    }

    .seller-rating-stars {
      display: flex;
      gap: 2px;
    }

    .seller-rating-stars .star {
      font-size: 0.8rem;
    }

    .seller-rating-text {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .seller-detail-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: var(--muted);
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
    }

    .seller-detail-row:last-of-type {
      border-bottom: none;
    }

    .seller-detail-row .icon {
      font-size: 1rem;
    }

    .seller-detail-row strong {
      color: var(--text);
    }

    .btn-contact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.8rem;
      margin-top: 1.25rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-phone {
      background: var(--success);
      color: #fff;
      border: none;
    }

    .btn-phone:hover {
      background: #16a34a;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
    }

    /* Inquiry form */
    .inquiry-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .inquiry-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.35rem;
    }

    .inquiry-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .field input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .field input::placeholder {
      color: var(--muted);
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background: #c72e08;
      box-shadow: 0 0 24px var(--accent-glow);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Quick Actions */
    .quick-actions {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .quick-actions-title {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 0.6rem;
      text-align: left;
    }

    .action-btn:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .action-btn .icon {
      font-size: 1.1rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      color: var(--text);
      padding: 1rem 1.25rem;
      border-radius: 8px;
      font-size: 0.88rem;
      z-index: 9999;
      opacity: 0;
      transform: translateY(-12px);
      transition: all 0.3s;
      max-width: 320px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.success {
      border-left-color: var(--success);
    }

    .toast.error {
      border-left-color: #e83e3e;
    }

    /* Loading */
    .loading-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1.5rem;
      color: var(--muted);
    }

    .loading-overlay .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .not-found {
      text-align: center;
      padding: 6rem 2rem;
    }

    .not-found .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .not-found h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .not-found p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .not-found a {
      display: inline-block;
      padding: 0.7rem 1.5rem;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .right-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      .inquiry-card {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 768px) {
      nav {
        padding: 1rem;
      }

      .container {
        padding: 0 1rem 3rem;
      }

      .right-col {
        display: block;
      }

      .veh-title {
        font-size: 1.8rem;
      }

      .gallery-main {
        height: 280px;
      }

      #viewer-canvas {
        height: 260px;
      }

      .rating-summary {
        flex-direction: column;
        gap: 1rem;
      }
    }

    /* ===== SPEEDOMETER STAR RATING ===== */
    .star-input {
      display: flex;
      gap: 0.5rem;
      flex-direction: row-reverse;
      justify-content: flex-end;
      margin-bottom: 0.5rem;
    }

    .star-input input {
      display: none;
    }

    .star-input label {
      font-size: 2.2rem;
      color: var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
      filter: drop-shadow(0 0 0px transparent);
      line-height: 1;
      padding: 2px 4px;
    }

    .star-input label:hover,
    .star-input label:hover~label,
    .star-input input:checked~label {
      color: var(--star);
      filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.6));
      transform: scale(1.15);
    }

    .star-input input:checked~label {
      animation: starGlow 1.8s ease-in-out infinite alternate;
    }

    @keyframes starGlow {
      from {
        filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.5));
      }

      to {
        filter: drop-shadow(0 0 14px rgba(245, 158, 11, 0.95)) drop-shadow(0 0 3px #fff);
      }
    }

    /* Speedometer Overlay */
    .speedo-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(10, 10, 15, 0.97) 0%, rgba(5, 5, 8, 0.99) 100%);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s;
      backdrop-filter: blur(10px);
    }

    .speedo-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .speedo-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(0.85) translateY(30px);
      transition: transform 0.5s cubic-bezier(0.2, 1, 0.3, 1.1);
    }

    .speedo-overlay.show .speedo-card {
      transform: scale(1) translateY(0);
    }

    .speedo-canvas {
      display: block;
      width: 300px;
      height: 300px;
      filter: drop-shadow(0 0 28px rgba(232, 57, 14, 0.35));
    }

    .speedo-badge {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #1a0a05, #0a0a0b);
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      color: var(--accent);
      box-shadow: 0 0 18px var(--accent-glow), inset 0 0 12px rgba(232, 57, 14, 0.1);
      opacity: 0;
      transform: scale(0);
      transition: all 0.4s cubic-bezier(0.2, 1.5, 0.4, 1) 0.3s;
    }

    .speedo-overlay.show .speedo-badge {
      opacity: 1;
      transform: scale(1);
    }

    .speedo-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: rgba(232, 57, 14, 0.55);
      margin-top: 10px;
      text-transform: uppercase;
      animation: accentBlink 2s ease-in-out infinite;
    }

    @keyframes accentBlink {

      0%,
      100% {
        opacity: 0.5
      }

      50% {
        opacity: 1
      }
    }

    .speedo-tap-hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: rgba(232, 57, 14, 0.35);
      cursor: pointer;
      z-index: 10100;
      opacity: 0;
      transition: opacity 0.5s;
      padding: 5px 14px;
      border: 1px solid rgba(232, 57, 14, 0.15);
      border-radius: 30px;
      background: rgba(10, 10, 11, 0.7);
      text-transform: uppercase;
      pointer-events: none;
    }

    .speedo-overlay.show~.speedo-tap-hint {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <!-- Nav -->
  <nav>
    <a href="index.html" class="nav-logo">Four<span>Wheels</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="vehicles.html">Listings</a>
      <a href="#" id="navDashLink" style="display:none"></a>
    </div>
    <div class="nav-user" id="navUser" style="display:none">
      <span id="navName" style="font-size:0.85rem;color:var(--muted)"></span>
      <button class="nav-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- Content -->
  <div class="container" id="mainContent">
    <div class="loading-overlay" id="loadingState">
      <div class="spinner"></div>
      <span>Loading vehicle details…</span>
    </div>
  </div>

  <!-- Fullscreen 3D Overlay -->
  <div id="fsOverlay"></div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Speedometer Rating Overlay -->
  <div class="speedo-overlay" id="speedoOverlay">
    <div class="speedo-card" id="speedoCard">
      <div class="speedo-badge" id="speedoBadge">0</div>
      <canvas id="speedoCanvas" class="speedo-canvas" width="600" height="600"></canvas>
      <div class="speedo-label" id="speedoLabel">⚡ RATING ENGINE ⚡</div>
    </div>
  </div>
  <div class="speedo-tap-hint" id="speedoTapHint">TAP ANYWHERE TO CLOSE</div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    const API = 'http://localhost:5000/api';
    const token = localStorage.getItem('fw_token');
    const user = JSON.parse(localStorage.getItem('fw_user') || 'null');

    // Nav user info
    // Nav user info
    if (user) {
      document.getElementById('navUser').style.display = 'flex';
      document.getElementById('navName').textContent = user.name;

      const dashLink = document.getElementById('navDashLink');
      dashLink.style.display = 'block';

      if (user.role === 'admin') {
        dashLink.href = 'admin-dashboard.html';
        dashLink.textContent = 'Admin Panel';
      } else if (user.role === 'seller') {
        dashLink.href = 'seller-dashboard.html';
        dashLink.textContent = 'My Dashboard';
      } else {
        dashLink.href = 'buyer-messages.html';
        dashLink.textContent = 'My Messages';
      }
    }
    function logout() {
      localStorage.removeItem('fw_token');
      localStorage.removeItem('fw_user');
      window.location.href = 'login.html';
    }

    function showToast(msg, type = 'error') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    const params = new URLSearchParams(window.location.search);
    const vehicleId = params.get('id');

    if (!vehicleId) {
      showNotFound();
    } else {
      loadVehicle();
    }

    async function loadVehicle() {
      try {
        const headers = {};
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(`${API}/vehicles/${vehicleId}`, { headers });
        if (!res.ok) throw new Error('Not found');
        const vehicle = await res.json();
        renderVehicle(vehicle);
      } catch (err) {
        showNotFound();
      }
    }

    function showNotFound() {
      document.getElementById('mainContent').innerHTML = `
        <div class="not-found">
          <div class="icon">🚗</div>
          <h2>Vehicle Not Found</h2>
          <p>The listing you're looking for doesn't exist or has been removed.</p>
          <a href="vehicles.html">Browse All Listings</a>
        </div>`;
    }

    function formatPrice(p) {
      if (!p) return 'Price on Request';
      return 'PKR ' + Number(p).toLocaleString('en-PK');
    }

    function formatDate(d) {
      return new Date(d).toLocaleDateString('en-PK', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function getInitials(name) {
      if (!name) return '?';
      return name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
    }

    // ===== STARS HELPER =====
    function renderStars(rating, size = 'md') {
      const sz = size === 'sm' ? '0.8rem' : '0.95rem';
      let html = '';
      for (let i = 1; i <= 5; i++) {
        html += `<span class="star ${i <= Math.round(rating) ? 'filled' : 'empty'}" style="font-size:${sz}">★</span>`;
      }
      return html;
    }

    function renderVehicle(v) {
      const isSeller = user && (user.id === v.seller?._id || user.id === v.seller?.id);
      const isAdmin = user && user.role === 'admin';
      const hasModel = !!v.modelFile;
      const statusClass = v.status || 'pending';
      const statusLabel = (v.status || 'pending').charAt(0).toUpperCase() + (v.status || 'pending').slice(1);
      const images = v.images && v.images.length > 0 ? v.images : [];

      document.title = `FourWheels — ${v.title}`;

      document.getElementById('mainContent').innerHTML = `
        <div class="breadcrumb">
          <a href="index.html">Home</a> ›
          <a href="vehicles.html">Listings</a> ›
          <span>${v.title}</span>
        </div>

        <div class="detail-grid">
          <!-- LEFT COL -->
          <div class="left-col">

            <!-- Image Gallery -->
            <div class="gallery">
              <div class="gallery-main" id="galleryMain">
                ${images.length > 0
          ? `<img id="mainImg" src="${API.replace('/api', '')}/${images[0]}" alt="${v.title}" onerror="this.parentElement.innerHTML='<div class=\\'no-image\\'><span>🚗</span><p>Image unavailable</p></div>'">`
          : `<div class="no-image"><span>🚗</span><p>No images uploaded</p></div>`}
                ${images.length > 1 ? `
                <div class="gallery-nav">
                  <button onclick="prevImg()" title="Previous">‹</button>
                  <button onclick="nextImg()" title="Next">›</button>
                </div>
                <div class="img-counter" id="imgCounter">1 / ${images.length}</div>` : ''}
              </div>
              ${images.length > 1 ? `
              <div class="gallery-thumbs" id="galleryThumbs">
                ${images.map((img, i) => `
                  <img class="thumb ${i === 0 ? 'active' : ''}"
                       src="${API.replace('/api', '')}/${img}"
                       alt="Image ${i + 1}"
                       onclick="goToImg(${i})"
                       onerror="this.style.display='none'"/>
                `).join('')}
              </div>` : ''}
            </div>

            <!-- 3D Viewer -->
            <div class="viewer-section" id="viewerSection">
              <div class="viewer-header">
                <div class="viewer-title">
                  <span class="dot"></span>
                  3D Vehicle Preview
                  ${hasModel ? '<span class="badge-3d">LIVE MODEL</span>' : '<span class="badge-3d" style="border-color:var(--muted);color:var(--muted)">DEMO</span>'}
                </div>
                <span class="viewer-tip">🖱 Click to explore in 3D</span>
              </div>
              <div style="position:relative;">
                <canvas id="previewCanvas"></canvas>
              </div>
              <div class="preview-hint">⛶ Click model to open fullscreen 3D viewer</div>
            </div>

            <!-- Vehicle Info -->
            <div class="info-section">
              <div class="veh-status ${statusClass}">${statusLabel}</div>
              <div class="veh-title">${v.title}</div>
              <div class="veh-price">${formatPrice(v.price)}</div>

              <div class="veh-meta">
                <div class="meta-chip"><span class="icon">📍</span> ${v.city || 'N/A'}</div>
                <div class="meta-chip"><span class="icon">🚗</span> ${(v.category || '').charAt(0).toUpperCase() + (v.category || '').slice(1)}</div>
                <div class="meta-chip"><span class="icon">📅</span> Listed ${formatDate(v.createdAt)}</div>
                <div class="meta-chip"><span class="icon">👁</span> ${v.views || 0} views</div>
              </div>

              <div class="section-label">Description</div>
              <div class="veh-description">${v.description || 'No description provided.'}</div>

              <div class="stats-row">
                <div class="stat-box">
                  <div class="num">${v.views || 0}</div>
                  <div class="lbl">Views</div>
                </div>
                <div class="stat-box">
                  <div class="num">${images.length}</div>
                  <div class="lbl">Photos</div>
                </div>
                <div class="stat-box">
                  <div class="num">${hasModel ? '✓' : '–'}</div>
                  <div class="lbl">3D Model</div>
                </div>
              </div>
            </div>

            <!-- ===== REVIEWS SECTION ===== -->
            <div class="reviews-section" id="reviewsSection">
              <div class="reviews-header">
                <div class="reviews-header-title">Seller <span>Reviews</span></div>
                <span id="reviewsCountBadge" style="font-size:0.78rem;color:var(--muted);">Loading…</span>
              </div>

              <!-- Rating Summary -->
              <div class="rating-summary" id="ratingSummary">
                <div style="color:var(--muted);font-size:0.85rem;padding:1rem">Loading reviews…</div>
              </div>

              <!-- Review List -->
              <div class="review-list" id="reviewList">
              </div>

              <div class="reviews-load-more" id="loadMoreWrap" style="display:none">
                <button class="btn-load-more" onclick="loadMoreReviews()">Load More Reviews</button>
              </div>
            </div>

          </div>

          <!-- RIGHT COL -->
          <div class="right-col">

            <!-- Seller Card -->
            <div class="seller-card">
              <div class="seller-card-title">Seller Information</div>
              <div class="seller-info">
                <div class="seller-avatar">${getInitials(v.seller?.name)}</div>
                <div>
                  <div class="seller-name">${v.seller?.name || 'Unknown Seller'}</div>
                  <div class="seller-since">Member since ${v.seller?.createdAt ? formatDate(v.seller.createdAt) : 'N/A'}</div>
                  <div class="seller-rating-row" id="sellerRatingRow">
                    <span style="font-size:0.72rem;color:var(--muted)">Loading rating…</span>
                  </div>
                </div>
              </div>
              <div class="seller-detail-row">
                <span class="icon">📧</span>
                <strong>${v.seller?.email || 'N/A'}</strong>
              </div>
              <div class="seller-detail-row">
                <span class="icon">📞</span>
                <strong>${v.seller?.phone || 'Not provided'}</strong>
              </div>
              <div class="seller-detail-row">
                <span class="icon">📍</span>
                <strong>${v.seller?.city || 'N/A'}</strong>
              </div>
              ${v.seller?.phone ? `
              <a class="btn-contact btn-phone" href="tel:${v.seller.phone}">
                📞 Call Seller
              </a>` : ''}
            </div>

            <!-- Write Review Card (buyers only, not seller's own listing) -->
            ${user && !isSeller && user.role !== 'admin' ? `
            <div class="write-review-card" id="writeReviewCard">
              <div class="write-review-title">Rate This Seller</div>
              <div class="write-review-sub" id="reviewCardSub">Share your experience with this seller.</div>

              <form id="reviewForm">
                <div class="field">
                  <label>Your Rating *</label>
                  <div class="star-input" id="starInput">
                    <input type="radio" name="rating" id="s5" value="5"/><label for="s5" title="5 stars">★</label>
                    <input type="radio" name="rating" id="s4" value="4"/><label for="s4" title="4 stars">★</label>
                    <input type="radio" name="rating" id="s3" value="3"/><label for="s3" title="3 stars">★</label>
                    <input type="radio" name="rating" id="s2" value="2"/><label for="s2" title="2 stars">★</label>
                    <input type="radio" name="rating" id="s1" value="1"/><label for="s1" title="1 star">★</label>
                  </div>  
                </div>
                <div class="field">
                  <label>Comment (Optional)</label>
                  <textarea id="reviewComment" rows="3" placeholder="Describe your experience with this seller…"></textarea>
                </div>
                <button type="submit" class="btn-submit" id="reviewSubmitBtn">Submit Review</button>
              </form>
            </div>
            ` : ''}

            <!-- Inquiry Form -->
            <div class="inquiry-card">
              <div class="inquiry-title">Send Inquiry</div>
              <div class="inquiry-sub">Interested? Contact the seller directly.</div>

              ${user ? `
              <form id="inquiryForm">
                <div class="field">
                  <label>Your Name</label>
                  <input type="text" value="${user.name}" readonly style="opacity:0.7"/>
                </div>
                <div class="field">
                  <label>Message</label>

            <!-- Quick Actions -->
            <div class="quick-actions">
              <div class="quick-actions-title">Quick Actions</div>
              <button class="action-btn" onclick="shareVehicle()">
                <span class="icon">🔗</span> Copy Share Link
              </button>
              ${isSeller || isAdmin ? `
              <button class="action-btn" onclick="window.location.href='seller-dashboard.html'">
                <span class="icon">✏️</span> Edit This Listing
              </button>` : ''}
              <button class="action-btn" onclick="window.location.href='vehicles.html'">
                <span class="icon">🔍</span> Browse Similar Vehicles
              </button>
              ${v.seller?._id || v.seller?.id ? `

      `;

      // Init gallery state
      window._imgs = images;

      // Init 3D viewer
      init3DViewer(v.modelFile);

      // Init inquiry form
      if (user) {
        document.getElementById('inquiryForm')?.addEventListener('submit', handleInquiry);

      // Load reviews
      const sellerId = v.seller?._id || v.seller?.id;
      if (sellerId) {
        window._sellerId = sellerId;
        window._reviewPage = 1;
