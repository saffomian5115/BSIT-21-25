    // ===== GALLERY =====
    function goToImg(idx) {
      const imgs = window._imgs;
      if (!imgs || !imgs.length) return;
      window._imgIdx = idx;
      const mainImg = document.getElementById('mainImg');
      if (mainImg) mainImg.src = `${API.replace('/api', '')}/${imgs[idx]}`;
      const counter = document.getElementById('imgCounter');
      if (counter) counter.textContent = `${idx + 1} / ${imgs.length}`;
      document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === idx));
    }

    function nextImg() { const len = (window._imgs || []).length; goToImg((window._imgIdx + 1) % len); }
    function prevImg() { const len = (window._imgs || []).length; goToImg((window._imgIdx - 1 + len) % len); }

    // ===== 3D VIEWER =====

    // Shared state
    let previewScene, previewCamera, previewRenderer, previewMesh;
    let fsScene, fsCamera, fsRenderer, fsMesh;
    let fsAnimId;
    let fsIsDragging = false, fsPrevMouse = { x: 0, y: 0 };
    let fsRotX = 0.2, fsRotY = 0;
    let fsBgDark = true;
    let fsWireframe = false;
    let currentModelPath = null;
    let previewBgDark = true;
    let previewRotY = 0;

    // ---- PREVIEW ----
    function init3DViewer(modelFilePath) {
      currentModelPath = modelFilePath || null;
      const canvas = document.getElementById('previewCanvas');
      if (!canvas) return;

      previewScene = new THREE.Scene();
      previewScene.background = new THREE.Color(0x0d0d10);

      const w = canvas.clientWidth;
      const h = canvas.clientHeight || 340;

      previewCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
      previewCamera.position.set(0, 0, 5);

      previewRenderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      previewRenderer.setSize(w, h);
      previewRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      previewRenderer.shadowMap.enabled = true;

      addLights(previewScene);

      if (modelFilePath) {
        loadGLBIntoScene(modelFilePath, previewScene, (mesh) => {
          previewMesh = mesh;
          snapToGrid(previewMesh);
        });
      } else {
        previewMesh = buildGenericCar(previewScene);
        snapToGrid(previewMesh);
      }

      window.addEventListener('resize', () => {
        const w2 = canvas.clientWidth;
        previewRenderer.setSize(w2, h);
        previewCamera.aspect = w2 / h;
        previewCamera.updateProjectionMatrix();
      });

      canvas.addEventListener('click', openFullscreen);

      function previewLoop() {
        requestAnimationFrame(previewLoop);
        previewRotY += 0.004;
        if (previewMesh) {
          previewMesh.rotation.y = previewRotY;
          previewMesh.rotation.x = 0.08;
        }
        previewRenderer.render(previewScene, previewCamera);
      }
      previewLoop();
    }

    // Model ko grid ke bilkul upar rakhna
    function snapToGrid(mesh) {
      if (!mesh) return;
      const box = new THREE.Box3().setFromObject(mesh);
      const minY = box.min.y;
      mesh.position.y -= minY;

      // Centre on Y axis
      const box2 = new THREE.Box3().setFromObject(mesh);
      const centerY = (box2.min.y + box2.max.y) / 2;
      // Camera ko model ki height ke hisaab se adjust
      if (previewCamera) previewCamera.position.y = centerY;
      if (fsCamera) fsCamera.position.y = centerY;
    }

    function togglePreviewBg() {
      previewBgDark = !previewBgDark;
      if (previewScene) {
        previewScene.background = new THREE.Color(previewBgDark ? 0x0d0d10 : 0xf0f0f0);
      }
      const btn = document.getElementById('previewBgBtn');
      if (btn) btn.textContent = previewBgDark ? '☀ Light' : '🌙 Dark';
    }

    // ---- FULLSCREEN ----
    function openFullscreen() {
      let overlay = document.getElementById('fsOverlay');
      if (!overlay) return;
      overlay.classList.add('active');

      if (!document.getElementById('fs-canvas')) {
        buildFSOverlay(overlay);
      }

      if (!fsRenderer) {
        initFSRenderer();
      }

      playZoomInAnimation();
    }

    function buildFSOverlay(overlay) {
      overlay.innerHTML = `
        <canvas id="fs-canvas"></canvas>
        <div class="fs-controls">
          <button class="ctrl-btn active" id="fsSolidBtn" onclick="setFSWireframe(false)">Solid</button>
          <button class="ctrl-btn" id="fsWireBtn" onclick="setFSWireframe(true)">Wireframe</button>
          <button class="ctrl-btn" onclick="resetFSView()">↺ Reset</button>
          <button class="ctrl-btn" id="fsBgBtn" onclick="toggleFSBg()">☀ Light BG</button>
          <button class="fs-close-btn" onclick="closeFullscreen()">✕ Close</button>
        </div>
      `;
    }

    function initFSRenderer() {
      const canvas = document.getElementById('fs-canvas');
      if (!canvas) return;

      const w = window.innerWidth;
      const h = window.innerHeight;

      fsScene = new THREE.Scene();
      fsScene.background = new THREE.Color(0x0a0a0b);

      fsCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
      fsCamera.position.set(0, 0, 6);

      fsRenderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      fsRenderer.setSize(w, h);
      fsRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      fsRenderer.shadowMap.enabled = true;

      addLights(fsScene);

      if (currentModelPath) {
        loadGLBIntoScene(currentModelPath, fsScene, (mesh) => {
          fsMesh = mesh;
          fsMesh.rotation.y = fsRotY;
          const box = new THREE.Box3().setFromObject(fsMesh);
          const minY = box.min.y;
          fsMesh.position.y -= minY;
          fsCamera.position.y = +0.5; // yahan value change karo
        });
      } else {
        fsMesh = buildGenericCar(fsScene);
        const box = new THREE.Box3().setFromObject(fsMesh);
        const minY = box.min.y;
        fsMesh.position.y -= minY;
        fsCamera.position.y = +0.5; // yahan value change karo
      }

      // Mouse controls
      canvas.addEventListener('mousedown', e => {
        fsIsDragging = true;
        fsPrevMouse = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('mousemove', e => {
        if (!fsIsDragging) return;
        const dx = e.clientX - fsPrevMouse.x;
        const dy = e.clientY - fsPrevMouse.y;
        fsRotY += dx * 0.01;
        fsRotX += dy * 0.005;
        fsRotX = Math.max(-0.8, Math.min(0.8, fsRotX));
        fsPrevMouse = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('mouseup', () => { fsIsDragging = false; });

      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        fsCamera.position.z = Math.max(2, Math.min(14, fsCamera.position.z + e.deltaY * 0.012));
      }, { passive: false });

      // Touch
      canvas.addEventListener('touchstart', e => {
        fsIsDragging = true;
        fsPrevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }, { passive: true });
      canvas.addEventListener('touchmove', e => {
        if (!fsIsDragging) return;
        const dx = e.touches[0].clientX - fsPrevMouse.x;
        const dy = e.touches[0].clientY - fsPrevMouse.y;
        fsRotY += dx * 0.01;
        fsRotX += dy * 0.005;
        fsRotX = Math.max(-0.8, Math.min(0.8, fsRotX));
        fsPrevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }, { passive: true });
      canvas.addEventListener('touchend', () => { fsIsDragging = false; });

      window.addEventListener('resize', () => {
        const w2 = window.innerWidth;
        const h2 = window.innerHeight;
        fsRenderer.setSize(w2, h2);
        fsCamera.aspect = w2 / h2;
        fsCamera.updateProjectionMatrix();
      });

      // FS animate loop — auto-rotate jab drag na ho
      function fsLoop() {
        fsAnimId = requestAnimationFrame(fsLoop);
        if (fsMesh) {
          if (!fsIsDragging) fsRotY += 0.004; // auto-rotate always on
          fsMesh.rotation.y = fsRotY;
          fsMesh.rotation.x = fsRotX;
        }
        fsRenderer.render(fsScene, fsCamera);
      }
      fsLoop();
    }

    // FS scene ke liye grid snap
    function snapToGridFS(mesh) {
      if (!mesh) return;
      const box = new THREE.Box3().setFromObject(mesh);
      const minY = box.min.y;
      mesh.position.y -= minY;
    }

    function playZoomInAnimation() {
      if (!fsCamera) return;
      fsCamera.position.set(0, fsCamera.position.y, 22);
      const targetZ = 6;
      const startTime = performance.now();
      const duration = 900;

      function zoomStep(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        fsCamera.position.z = 22 - (22 - targetZ) * ease;
        if (t < 1) requestAnimationFrame(zoomStep);
      }
      requestAnimationFrame(zoomStep);
    }

    function closeFullscreen() {
      const overlay = document.getElementById('fsOverlay');
      if (overlay) overlay.classList.remove('active');
    }

    function setFSWireframe(val) {
      fsWireframe = val;
      if (fsMesh) fsMesh.traverse(c => { if (c.isMesh) c.material.wireframe = val; });
      document.getElementById('fsSolidBtn')?.classList.toggle('active', !val);
      document.getElementById('fsWireBtn')?.classList.toggle('active', val);
    }

    function toggleFSBg() {
      fsBgDark = !fsBgDark;
      if (fsScene) fsScene.background = new THREE.Color(fsBgDark ? 0x0a0a0b : 0xf0f0f0);
      const btn = document.getElementById('fsBgBtn');
      if (btn) btn.textContent = fsBgDark ? '☀ Light BG' : '🌙 Dark BG';
    }

    function resetFSView() {
      fsRotX = 0.2;
      fsRotY = 0;
      playZoomInAnimation();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeFullscreen();
    });

    // ---- SHARED HELPERS ----
    function addLights(sc) {
      sc.add(new THREE.AmbientLight(0xffffff, 0.6));
      const key = new THREE.DirectionalLight(0xffffff, 1.2);
      key.position.set(5, 8, 5);
      sc.add(key);
      const fill = new THREE.DirectionalLight(0xe8390e, 0.4);
      fill.position.set(-5, 2, -3);
      sc.add(fill);
    }

    function loadGLBIntoScene(modelFilePath, sc, onLoad) {
      if (typeof THREE.GLTFLoader === 'undefined') {
        const mesh = buildGenericCar(sc);
        if (onLoad) onLoad(mesh);
        return;
      }
      const loader = new THREE.GLTFLoader();
      const url = API.replace('/api', '') + '/' + modelFilePath;
      loader.load(url, gltf => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 3 / maxDim;
        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));
        sc.add(model);
        if (onLoad) onLoad(model);
      }, null, () => {
        const mesh = buildGenericCar(sc);
        if (onLoad) onLoad(mesh);
      });
    }

    function buildGenericCar(sc) {
      const carGroup = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe8390e, roughness: 0.3, metalness: 0.7 });
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x88aacc, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.6 });
      const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8, metalness: 0.2 });
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.2, metalness: 0.9 });

      const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.6, 1.8), bodyMat);
      lowerBody.position.y = 0.1;
      carGroup.add(lowerBody);

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 1.65), bodyMat);
      cabin.position.set(-0.15, 0.65, 0);
      carGroup.add(cabin);

      const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.62, 1.5), glassMat);
      windshield.position.set(0.97, 0.65, 0);
      windshield.rotation.z = -0.25;
      carGroup.add(windshield);

      const hood = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.12, 1.75), bodyMat);
      hood.position.set(1.5, 0.46, 0);
      carGroup.add(hood);

      const frontBumper = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.35, 1.85), blackMat);
      frontBumper.position.set(1.97, -0.05, 0);
      carGroup.add(frontBumper);

      [-0.65, 0.65].forEach(z => {
        const hl = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.16, 0.32),
          new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: 0xffffaa, emissiveIntensity: 0.8 }));
        hl.position.set(1.96, 0.08, z);
        carGroup.add(hl);
      });

      [[1.1, -0.38, 1.0], [1.1, -0.38, -1.0], [-1.1, -0.38, 1.0], [-1.1, -0.38, -1.0]].forEach(([x, y, z]) => {
        const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.28, 24), tireMat);
        tire.rotation.x = Math.PI / 2;
        tire.position.set(x, y, z);
        carGroup.add(tire);
        const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.3, 12), rimMat);
        rim.rotation.x = Math.PI / 2;
        rim.position.set(x, y, z);
        carGroup.add(rim);
      });

      sc.add(carGroup);
      return carGroup;
    }

    function setWireframe() { }
    function resetCamera() { }

    // ===== REVIEWS =====
    async function loadSellerReviews(sellerId, reset = false) {
      try {
        if (reset) window._reviewPage = 1;

        const res = await fetch(`${API}/reviews/seller/${sellerId}?page=${window._reviewPage}&limit=5`);
        const data = await res.json();

        window._reviewTotal = data.total || 0;

        // Update seller rating in sidebar
        updateSellerRatingDisplay(data.avgRating || 0, data.total || 0);

        // Update reviews count badge
        const badge = document.getElementById('reviewsCountBadge');
        if (badge) badge.textContent = `${data.total || 0} review${data.total !== 1 ? 's' : ''}`;

        // Render rating summary
        renderRatingSummary(data.avgRating || 0, data.total || 0, data.ratingDistribution || {});

        // Render review cards
        const list = document.getElementById('reviewList');
        if (!list) return;

        if (reset) list.innerHTML = '';

        if (!data.reviews || data.reviews.length === 0) {
          if (reset) {
            list.innerHTML = `
              <div class="reviews-empty">
                <div class="icon">⭐</div>
                <p>No reviews yet for this seller.</p>
              </div>`;
          }
        } else {
          data.reviews.forEach((review, idx) => {
            const card = buildReviewCard(review, idx);
            list.insertAdjacentHTML('beforeend', card);
          });
        }

        // Load more button
        const loadMoreWrap = document.getElementById('loadMoreWrap');
        if (loadMoreWrap) {
          const hasMore = (window._reviewPage * 5) < data.total;
          loadMoreWrap.style.display = hasMore ? 'block' : 'none';
        }

      } catch (err) {
        const ratingSummary = document.getElementById('ratingSummary');
        if (ratingSummary) ratingSummary.innerHTML = `<div style="color:var(--muted);font-size:0.85rem;padding:0.5rem">Could not load reviews.</div>`;
      }
    }

    function renderRatingSummary(avg, total, dist) {
      const el = document.getElementById('ratingSummary');
      if (!el) return;

      if (total === 0) {
        el.innerHTML = `
          <div style="color:var(--muted);font-size:0.88rem;padding:0.5rem 0;">
            No reviews yet. Be the first to review this seller!
          </div>`;
        return;
      }

      const starsHtml = renderStars(avg);
      let barsHtml = '';
      for (let i = 5; i >= 1; i--) {
        const count = dist[i] || 0;
        const pct = total > 0 ? (count / total) * 100 : 0;
        barsHtml += `
          <div class="rating-bar-row">
            <span>${i}★</span>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%"></div>
            </div>
            <span class="bar-count">${count}</span>
          </div>`;
      }

      el.innerHTML = `
        <div class="rating-big">
          <div class="num">${avg.toFixed(1)}</div>
          <div class="stars">${starsHtml}</div>
          <div class="count">${total} review${total !== 1 ? 's' : ''}</div>
        </div>
        <div class="rating-bars">${barsHtml}</div>`;
    }

    function updateSellerRatingDisplay(avg, total) {
      const el = document.getElementById('sellerRatingRow');
      if (!el) return;
      if (total === 0) {
        el.innerHTML = `<span style="font-size:0.72rem;color:var(--muted)">No reviews yet</span>`;
        return;
      }
      el.innerHTML = `
        <div class="seller-rating-stars">${renderStars(avg, 'sm')}</div>
        <span class="seller-rating-text">${avg.toFixed(1)} (${total})</span>`;
    }

    function buildReviewCard(review, idx) {
      const name = review.reviewer?.name || 'Anonymous';
      const initials = name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
      const date = formatDate(review.createdAt);
      const starsHtml = renderStars(review.rating);
      const isOwn = user && (review.reviewer?._id === user.id || review.reviewer?.id === user.id);
      const isAdmin = user && user.role === 'admin';

      return `
        <div class="review-card" style="animation-delay:${idx * 80}ms" id="review-${review._id}">
          <div class="review-card-header">
            <div class="reviewer-info">
              <div class="reviewer-avatar">${initials}</div>
              <div>
                <div class="reviewer-name">${escHtml(name)}</div>
                <div class="reviewer-meta">${review.reviewer?.city ? '📍 ' + escHtml(review.reviewer.city) + ' · ' : ''}${date}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:0.75rem;">
              <div class="review-stars">${starsHtml}</div>
              ${isOwn || isAdmin ? `<button class="review-delete-btn" onclick="deleteReview('${review._id}')">Delete</button>` : ''}
            </div>
          </div>
          ${review.comment ? `<div class="review-comment">${escHtml(review.comment)}</div>` : ''}
        </div>`;
    }

    function loadMoreReviews() {
      window._reviewPage++;
      loadSellerReviews(window._sellerId, false);
    }

    async function checkExistingReview(sellerId) {
      if (!token) return;
      try {
        const res = await fetch(`${API}/reviews/check/${sellerId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.reviewed && data.review) {
          // Pre-fill form with existing review
          const ratingInput = document.querySelector(`input[name="rating"][value="${data.review.rating}"]`);
          if (ratingInput) ratingInput.checked = true;
          const commentInput = document.getElementById('reviewComment');
          if (commentInput) commentInput.value = data.review.comment || '';
          const sub = document.getElementById('reviewCardSub');
          if (sub) sub.textContent = 'You have already reviewed this seller. You can update your review below.';
          const btn = document.getElementById('reviewSubmitBtn');
          if (btn) btn.textContent = 'Update Review';
        }
      } catch (err) { }
    }

    async function handleReviewSubmit(e) {
      e.preventDefault();

      const ratingInput = document.querySelector('input[name="rating"]:checked');
      if (!ratingInput) {
        showToast('Please select a star rating', 'error');
        return;
      }

      const rating = parseInt(ratingInput.value);
      const comment = document.getElementById('reviewComment')?.value?.trim();
      const sellerId = window._sellerId;

      const btn = document.getElementById('reviewSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting…';

      try {
        const res = await fetch(`${API}/reviews`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ sellerId, rating, comment })
        });

        const data = await res.json();

        if (res.ok) {
          showToast(data.message || 'Review submitted!', 'success');
          // Reload reviews
          loadSellerReviews(sellerId, true);
          // Update button text
          btn.textContent = 'Update Review';
          const sub = document.getElementById('reviewCardSub');
          if (sub) sub.textContent = 'You have already reviewed this seller. You can update your review below.';
        } else {
          showToast(data.message || 'Could not submit review', 'error');
        }
      } catch (err) {
        showToast('Cannot connect to server', 'error');
      }

      btn.disabled = false;
    }

    async function deleteReview(reviewId) {
      if (!confirm('Delete this review?')) return;

      try {
        const res = await fetch(`${API}/reviews/${reviewId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (res.ok) {
          showToast('Review deleted.', 'success');
          document.getElementById(`review-${reviewId}`)?.remove();
          // Reload to update stats
          setTimeout(() => loadSellerReviews(window._sellerId, true), 300);
        } else {
          showToast(data.message || 'Could not delete review', 'error');
        }
      } catch (err) {
        showToast('Cannot connect to server', 'error');
      }
    }

    // ===== INQUIRY =====
    async function handleInquiry(e) {
      e.preventDefault();
      const msg = document.getElementById('msgText')?.value?.trim();
      if (!msg) { showToast('Please enter a message', 'error'); return; }

      const btn = document.getElementById('inquiryBtn');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        const res = await fetch(`${API}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ vehicle: vehicleId, message: msg }),
        });

        if (res.ok) {
          showToast('Message sent successfully!', 'success');
          document.getElementById('msgText').value = '';
        } else {
          showToast('Inquiry sent! (Messages feature coming soon)', 'success');
        }
      } catch {
        showToast('Message sent! (offline mode)', 'success');
      }

      btn.disabled = false;
      btn.textContent = 'Send Message';
    }

    // ===== SHARE =====
    function shareVehicle() {
      const url = window.location.href;
      navigator.clipboard?.writeText(url).then(() => {
        showToast('Link copied to clipboard!', 'success');
      }).catch(() => {
        showToast('Copy this URL: ' + url, 'success');
      });
    }

    // ===== UTILS =====
    function escHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ====== SPEEDOMETER RATING ENGINE ====== */
    (function () {
      const SPEED_MAP = { 1: 20, 2: 40, 3: 60, 4: 80, 5: 100 };
      const COLORS = {
        1: '#f59e0b', 2: '#f59e0b', 3: '#e8390e', 4: '#e8390e', 5: '#ff2200'
      };
      let _animFrame = null, _animating = false;
      let _currentVal = 0, _targetVal = 0;
      let _animStart = 0, _animDur = 0;
      let _activeRating = 0;
      let _audioCtx = null;
      let _closeTimeout = null;

      const canvas = document.getElementById('speedoCanvas');
      const ctx = canvas ? canvas.getContext('2d') : null;
      const W = 600, H = 600, CX = W / 2, CY = H / 2;

      function drawGauge(value) {
        if (!ctx) return;
        ctx.clearRect(0, 0, W, H);
        const R = 240;
        const START = -Math.PI * 0.8;
        const END = Math.PI * 0.8;
        const RANGE = END - START;
        const frac = Math.min(1, Math.max(0, value / 100));
        const needleAngle = START + RANGE * frac;
        const col = COLORS[_activeRating] || '#e8390e';

        // Track arc
        ctx.beginPath(); ctx.arc(CX, CY, R, START, END);
        ctx.strokeStyle = 'rgba(232,57,14,0.08)'; ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.stroke();

        // Outer glow ring
        const og = ctx.createRadialGradient(CX, CY, R - 6, CX, CY, R + 6);
        og.addColorStop(0, col + '99'); og.addColorStop(1, 'transparent');
        ctx.beginPath(); ctx.arc(CX, CY, R + 2, START, END);
        ctx.strokeStyle = og; ctx.lineWidth = 5; ctx.stroke();

        // Progress arc
        if (frac > 0) {
          ctx.beginPath(); ctx.arc(CX, CY, R, START, needleAngle);
          ctx.strokeStyle = col + '44'; ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.stroke();
          ctx.beginPath(); ctx.arc(CX, CY, R, START, needleAngle);
          ctx.strokeStyle = col; ctx.lineWidth = 10;
          ctx.shadowBlur = 22; ctx.shadowColor = col; ctx.stroke(); ctx.shadowBlur = 0;
        }

        // Dot ring
        for (let a = START; a <= END + 0.01; a += 0.045) {
          const dotR = R + 20, df = (a - START) / RANGE;
          const dx = CX + dotR * Math.cos(a), dy = CY + dotR * Math.sin(a);
          ctx.beginPath(); ctx.arc(dx, dy, 1.6, 0, Math.PI * 2);
          ctx.fillStyle = df <= frac ? col + 'cc' : 'rgba(232,57,14,0.12)'; ctx.fill();
        }

        // Tick marks
        for (let i = 0; i <= 100; i += 1) {
          const ta = START + RANGE * (i / 100);
          const isMajor = i % 10 === 0, isMid = i % 5 === 0 && !isMajor;
          if (!isMajor && !isMid) continue;
          const outer = R - 2, inner = isMajor ? R - 20 : R - 12;
          ctx.beginPath();
          ctx.moveTo(CX + outer * Math.cos(ta), CY + outer * Math.sin(ta));
          ctx.lineTo(CX + inner * Math.cos(ta), CY + inner * Math.sin(ta));
          ctx.strokeStyle = isMajor ? 'rgba(232,57,14,0.9)' : 'rgba(232,57,14,0.3)';
          ctx.lineWidth = isMajor ? 2.5 : 1.2; ctx.lineCap = 'butt'; ctx.stroke();
          if (isMajor) {
            const lr = R - 34, lx = CX + lr * Math.cos(ta), ly = CY + lr * Math.sin(ta);
            ctx.font = 'bold 18px "Bebas Neue", sans-serif';
            ctx.fillStyle = i <= (frac * 100) ? col : 'rgba(232,57,14,0.35)';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowBlur = i <= (frac * 100) ? 8 : 0; ctx.shadowColor = col;
            ctx.fillText(i.toString(), lx, ly); ctx.shadowBlur = 0;
          }
        }

        // Center disc
        const dg = ctx.createRadialGradient(CX, CY, 0, CX, CY, R - 38);
        dg.addColorStop(0, '#12080a'); dg.addColorStop(1, '#0a0a0b');
        ctx.beginPath(); ctx.arc(CX, CY, R - 40, 0, Math.PI * 2);
        ctx.fillStyle = dg; ctx.fill();
        ctx.beginPath(); ctx.arc(CX, CY, R - 40, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(232,57,14,0.07)'; ctx.lineWidth = 2; ctx.stroke();

        // Speed number
        const dv = Math.floor(value);
        ctx.font = '900 100px "Bebas Neue", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = col; ctx.shadowBlur = 28; ctx.shadowColor = col;
        ctx.fillText(dv, CX, CY - 18); ctx.shadowBlur = 0;
        ctx.font = '600 20px "DM Sans", sans-serif';
        ctx.fillStyle = 'rgba(232,57,14,0.4)'; ctx.fillText('MPS', CX, CY + 56);

        // Stars inside gauge
        ctx.font = '26px sans-serif'; ctx.textAlign = 'center';
        let ss = ''; for (let s = 1; s <= 5; s++) ss += s <= _activeRating ? '★' : '☆';
        ctx.fillStyle = col + 'bb'; ctx.shadowBlur = 8; ctx.shadowColor = col;
        ctx.fillText(ss, CX, CY + 95); ctx.shadowBlur = 0;

        // Needle
        const nl = R - 52, bl = 36;
        const nx = CX + nl * Math.cos(needleAngle), ny = CY + nl * Math.sin(needleAngle);
        const bx = CX - bl * Math.cos(needleAngle), by = CY - bl * Math.sin(needleAngle);
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(nx, ny);
        ctx.strokeStyle = col + '55'; ctx.lineWidth = 12; ctx.lineCap = 'round';
        ctx.shadowBlur = 28; ctx.shadowColor = col; ctx.stroke(); ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(nx, ny);
        ctx.strokeStyle = col; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
        ctx.shadowBlur = 14; ctx.shadowColor = col; ctx.stroke(); ctx.shadowBlur = 0;
        // needle tip white
        ctx.beginPath();
        ctx.moveTo(CX + (nl - 28) * Math.cos(needleAngle), CY + (nl - 28) * Math.sin(needleAngle));
        ctx.lineTo(nx, ny); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.8; ctx.stroke();
        // hub
        const hg = ctx.createRadialGradient(CX, CY, 0, CX, CY, 20);
        hg.addColorStop(0, col); hg.addColorStop(0.4, '#1a0505'); hg.addColorStop(1, '#0a0a0b');
        ctx.beginPath(); ctx.arc(CX, CY, 20, 0, Math.PI * 2);
        ctx.fillStyle = hg; ctx.shadowBlur = 18; ctx.shadowColor = col; ctx.fill(); ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.arc(CX, CY, 5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
      }

      function racingEase(t) {
        const c1 = 1.5, c3 = c1 + 1;
        const e = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        const ripple = Math.sin(t * Math.PI * 4) * 0.015 * (1 - t);
        return Math.max(0, Math.min(1, e + ripple));
      }

      function animateNeedle(rating, target) {
        if (_animFrame) cancelAnimationFrame(_animFrame);
        _currentVal = 0; _targetVal = target;
        _animStart = performance.now(); _animDur = rating * 1000; _animating = true;
        function tick(now) {
          const t = Math.min(1, (now - _animStart) / _animDur);
          const eased = racingEase(t);
          let val = _targetVal * eased;
          if (t > 0.05 && t < 0.92) val += (Math.random() - 0.5) * 1.6;
          _currentVal = Math.max(0, Math.min(_targetVal + 1, val));
          drawGauge(_currentVal);
          if (t < 1) { _animFrame = requestAnimationFrame(tick); }
          else {
            _currentVal = _targetVal; drawGauge(_currentVal); _animating = false;
            const lbl = document.getElementById('speedoLabel');
            if (lbl) lbl.textContent = `✅ ${_targetVal} MPS REACHED`;
          }
        }
        requestAnimationFrame(tick);
      }

      function initAudio() {
        if (_audioCtx) return _audioCtx;
        _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return _audioCtx;
      }

      function playSound(rating) {
        const ac = initAudio(); if (!ac) return;
        if (ac.state === 'suspended') ac.resume();
        const now = ac.currentTime;
        const master = ac.createGain(); master.connect(ac.destination);
        if (rating === 1) {
          master.gain.setValueAtTime(0.0001, now);
          master.gain.linearRampToValueAtTime(0.35, now + 0.3);
          master.gain.linearRampToValueAtTime(0, now + 1.8);
          [80, 160, 240].forEach((f, i) => {
            const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
            const g = ac.createGain(); g.gain.value = i === 0 ? 1 : 0.3;
            o.connect(g); g.connect(master); o.start(now); o.stop(now + 2);
          });
        } else if (rating === 2) {
          master.gain.setValueAtTime(0.0001, now); master.gain.linearRampToValueAtTime(0.45, now + 0.2);
          master.gain.linearRampToValueAtTime(0, now + 2.2);
          const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 110;
          o.frequency.linearRampToValueAtTime(180, now + 2);
          const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 10;
          const lg = ac.createGain(); lg.gain.value = 25;
          lfo.connect(lg); lg.connect(o.frequency);
          o.connect(master); o.start(now); o.stop(now + 2.5); lfo.start(now); lfo.stop(now + 2.5);
        } else if (rating === 3) {
          master.gain.setValueAtTime(0.0001, now); master.gain.linearRampToValueAtTime(0.5, now + 0.12);
          master.gain.linearRampToValueAtTime(0, now + 2.5);
          const o = ac.createOscillator(); o.type = 'sawtooth';
          o.frequency.setValueAtTime(220, now); o.frequency.linearRampToValueAtTime(460, now + 2);
          o.connect(master); o.start(now); o.stop(now + 2.8);
        } else if (rating === 4) {
          master.gain.setValueAtTime(0.0001, now); master.gain.linearRampToValueAtTime(0.6, now + 0.1);
          master.gain.exponentialRampToValueAtTime(0.0001, now + 3);
          const o = ac.createOscillator(); o.type = 'sawtooth';
          o.frequency.setValueAtTime(320, now); o.frequency.linearRampToValueAtTime(960, now + 1.8);
          o.connect(master); o.start(now); o.stop(now + 3);
          setTimeout(() => {
            const buf = ac.createBuffer(1, 1024, ac.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < 1024; i++) d[i] = (Math.random() - 0.5) * Math.exp(-i / 80);
            const bs = ac.createBufferSource(); bs.buffer = buf;
            const pg = ac.createGain(); pg.gain.value = 0.45;
            bs.connect(pg); pg.connect(ac.destination); bs.start();
          }, 1800);
        } else if (rating === 5) {
          master.gain.setValueAtTime(0.0001, now); master.gain.linearRampToValueAtTime(0.7, now + 0.07);
          master.gain.setValueAtTime(0.7, now + 2.5); master.gain.exponentialRampToValueAtTime(0.0001, now + 4.5);
          const o = ac.createOscillator(); o.type = 'sawtooth';
          o.frequency.setValueAtTime(420, now); o.frequency.linearRampToValueAtTime(1700, now + 2.5);
          o.connect(master); o.start(now); o.stop(now + 5);
          const o2 = ac.createOscillator(); o2.type = 'sawtooth';
          o2.frequency.setValueAtTime(840, now); o2.frequency.linearRampToValueAtTime(3400, now + 2.5);
          const g2 = ac.createGain(); g2.gain.value = 0.2; o2.connect(g2); g2.connect(master);
          o2.start(now); o2.stop(now + 5);
          [0.4, 0.9, 1.5, 2.1].forEach(delay => {
            const buf = ac.createBuffer(1, 2048, ac.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < 2048; i++) d[i] = (Math.random() - 0.5) * Math.exp(-i / 50);
            const bs = ac.createBufferSource(); bs.buffer = buf;
            const pg = ac.createGain(); pg.gain.value = 0.35;
            bs.connect(pg); pg.connect(ac.destination); bs.start(now + delay);
          });
        }
      }

      function showSpeedometer(rating) {
        _activeRating = rating;
        const target = SPEED_MAP[rating];
        const badge = document.getElementById('speedoBadge');
        const label = document.getElementById('speedoLabel');
        const overlay = document.getElementById('speedoOverlay');
        if (badge) badge.textContent = rating;
        if (label) label.textContent = '⚡ NEEDLE IN MOTION ⚡';
        if (overlay) overlay.classList.add('show');
        _currentVal = 0; drawGauge(0);
        setTimeout(() => animateNeedle(rating, target), 80);
        playSound(rating);
        if (_closeTimeout) clearTimeout(_closeTimeout);
        _closeTimeout = setTimeout(closeSpeedometer, rating * 1000 + 2200);
      }

      function closeSpeedometer() {
        const overlay = document.getElementById('speedoOverlay');
        if (overlay) overlay.classList.remove('show');
        if (_animFrame) { cancelAnimationFrame(_animFrame); _animFrame = null; }
        if (_closeTimeout) { clearTimeout(_closeTimeout); _closeTimeout = null; }
      }

      // Hook into star inputs
      function hookStarInputs() {
        document.querySelectorAll('input[name="rating"]').forEach(input => {
          input.addEventListener('change', () => {
            const r = parseInt(input.value);
            if (r >= 1 && r <= 5) showSpeedometer(r);
          });
        });
      }

      // Overlay click to close
      document.getElementById('speedoOverlay')?.addEventListener('click', closeSpeedometer);
      document.getElementById('speedoTapHint')?.addEventListener('click', closeSpeedometer);

      // Draw initial blank gauge
      if (ctx) { _activeRating = 3; drawGauge(0); _activeRating = 0; }

      // Hook stars on page load + after dynamic render
      const origRenderVehicle = window.renderVehicle;
      // Stars hook after DOM updates
      document.addEventListener('change', e => {
        if (e.target.name === 'rating') {
          const r = parseInt(e.target.value);
          if (r >= 1 && r <= 5) showSpeedometer(r);
        }
      });
    })();

    // Keyboard gallery navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') nextImg();
      if (e.key === 'ArrowLeft') prevImg();
    });
  </script>
