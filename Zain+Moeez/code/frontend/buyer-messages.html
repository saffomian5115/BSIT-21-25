<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FourWheels — My Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --surface: #111113;
      --card: #18181c;
      --card2: #1e1e23;
      --border: #2a2a30;
      --accent: #e8390e;
      --accent-glow: rgba(232,57,14,0.25);
      --accent-dim: rgba(232,57,14,0.08);
      --text: #f0f0f0;
      --muted: #6b6b75;
      --muted2: #9898a4;
      --input-bg: #0f0f12;
      --green: #22c55e;
      --red: #ef4444;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== NAV ===== */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 60px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      color: var(--text);
      text-decoration: none;
    }

    .nav-logo span { color: var(--accent); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-right a {
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-right a:hover { color: var(--text); }

    .nav-username {
      font-size: 0.82rem;
      color: var(--muted2);
    }

    .btn-logout {
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    /* ===== MAIN LAYOUT ===== */
    .messages-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      max-height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* ===== CONVERSATIONS PANEL ===== */
    .conv-panel {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .conv-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .conv-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    .conv-search {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      transition: border-color 0.2s;
    }

    .conv-search:focus-within { border-color: var(--accent); }

    .conv-search input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text);
    }

    .conv-search input::placeholder { color: var(--muted); }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* ===== CONVERSATION ITEM ===== */
    .conv-item {
      display: flex;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid rgba(42,42,48,0.5);
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }

    .conv-item:hover { background: rgba(255,255,255,0.02); }

    .conv-item.active {
      background: var(--accent-dim);
      border-left: 3px solid var(--accent);
    }

    .conv-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--card2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      color: var(--muted2);
      flex-shrink: 0;
    }

    .conv-avatar.has-unread {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .conv-info { flex: 1; overflow: hidden; min-width: 0; }

    .conv-name {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-vehicle {
      font-size: 0.72rem;
      color: var(--accent);
      margin-top: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .conv-preview {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .conv-time {
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .unread-badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.1rem 0.45rem;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
    }

    /* ===== CHAT PANEL ===== */
    .chat-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* Empty chat state */
    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: var(--muted);
      padding: 2rem;
      text-align: center;
    }

    .chat-empty .icon { font-size: 4rem; opacity: 0.3; }
    .chat-empty h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      color: var(--text);
      letter-spacing: 0.05em;
    }
    .chat-empty p { font-size: 0.85rem; }

    /* Chat header */
    .chat-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .chat-header-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      color: var(--accent);
      flex-shrink: 0;
    }

    .chat-header-info { flex: 1; }
    .chat-header-name { font-size: 0.95rem; font-weight: 600; }
    .chat-header-sub { font-size: 0.73rem; color: var(--muted); margin-top: 0.1rem; }

    .chat-header-vehicle {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.85rem;
      text-decoration: none;
      transition: border-color 0.2s;
    }

    .chat-header-vehicle:hover { border-color: var(--accent); }

    .chat-header-vehicle img {
      width: 38px; height: 30px;
      object-fit: cover;
      border-radius: 4px;
      background: var(--card2);
    }

    .veh-info-mini .veh-title { font-size: 0.8rem; font-weight: 600; color: var(--text); }
    .veh-info-mini .veh-price { font-size: 0.7rem; color: var(--accent); }

    /* Messages area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .date-separator {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.72rem;
      margin: 0.5rem 0;
    }

    .date-separator::before,
    .date-separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .msg-row {
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
      animation: msgIn 0.2s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.from-me { flex-direction: row-reverse; }

    .msg-avatar-sm {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--card2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.75rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .msg-row.from-me .msg-avatar-sm {
      background: var(--accent-dim);
      border-color: rgba(232,57,14,0.3);
      color: var(--accent);
    }

    .msg-content { max-width: 68%; }

    .msg-bubble {
      padding: 0.65rem 0.95rem;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .msg-row:not(.from-me) .msg-bubble {
      background: var(--card2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      color: var(--text);
    }

    .msg-row.from-me .msg-bubble {
      background: var(--accent-dim);
      border: 1px solid rgba(232,57,14,0.2);
      border-bottom-right-radius: 3px;
      color: var(--text);
    }

    .msg-time {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.25rem;
      padding: 0 0.25rem;
    }

    .msg-row.from-me .msg-time { text-align: right; }

    .msg-read-tick {
      display: inline-block;
      margin-left: 0.3rem;
      color: var(--green);
      font-size: 0.7rem;
    }

    /* Compose */
    .chat-compose {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .compose-input-wrap {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.6rem 1rem;
      transition: border-color 0.2s;
      display: flex;
      align-items: center;
    }

    .compose-input-wrap:focus-within { border-color: var(--accent); }

    .compose-input-wrap textarea {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      resize: none;
      max-height: 100px;
      line-height: 1.5;
      min-height: 24px;
    }

    .compose-input-wrap textarea::placeholder { color: var(--muted); }

    .btn-send {
      width: 42px; height: 42px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-send:hover { background: #c72e08; box-shadow: 0 0 16px var(--accent-glow); }
    .btn-send:active { transform: scale(0.93); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--card) 25%, var(--surface) 50%, var(--card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed;
      top: 4.5rem; right: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      color: var(--text);
      padding: 0.8rem 1.1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 9999;
      opacity: 0;
      transform: translateY(-8px);
      transition: all 0.3s;
      max-width: 300px;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-left-color: var(--green); }
    .toast.error { border-left-color: var(--red); }

    /* No conversations empty */
    .no-convs {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: var(--muted);
      padding: 2rem;
      text-align: center;
    }

    .no-convs .icon { font-size: 2.5rem; opacity: 0.35; }
    .no-convs p { font-size: 0.82rem; }
    .no-convs a {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.55rem 1.25rem;
      background: var(--accent);
      color: #fff;
      border-radius: 7px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .no-convs a:hover { background: #c72e08; }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .messages-layout { grid-template-columns: 1fr; }
      .conv-panel { display: none; }
      .conv-panel.mobile-show { display: flex; position: fixed; inset: 60px 0 0 0; z-index: 50; }
      .chat-panel { display: flex; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">Four<span>Wheels</span></a>
  <div class="nav-right">
    <a href="index.html">Home</a>
    <a href="vehicles.html">Browse</a>
    <span class="nav-username" id="navUsername"></span>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- MAIN LAYOUT -->
<div class="messages-layout">

  <!-- CONVERSATIONS LIST -->
  <div class="conv-panel" id="convPanel">
    <div class="conv-header">
      <div class="conv-title">💬 Messages</div>
      <div class="conv-search">
        <span style="color:var(--muted);font-size:0.85rem">🔍</span>
        <input type="text" id="convSearch" placeholder="Search conversations…" oninput="filterConvs(this.value)"/>
      </div>
    </div>
    <div class="conv-list" id="convList">
      <!-- Skeleton loaders -->
      ${[...Array(5)].map(() => `
        <div style="display:flex;gap:0.75rem;padding:1rem 1.5rem;border-bottom:1px solid rgba(42,42,48,0.5)">
          <div class="skeleton" style="width:42px;height:42px;border-radius:50%;flex-shrink:0"></div>
          <div style="flex:1">
            <div class="skeleton" style="height:12px;width:60%;margin-bottom:8px"></div>
            <div class="skeleton" style="height:10px;width:40%;margin-bottom:5px"></div>
            <div class="skeleton" style="height:9px;width:80%"></div>
          </div>
        </div>
      `).join('')}
    </div>
  </div>

  <!-- CHAT PANEL -->
  <div class="chat-panel" id="chatPanel">
    <div class="chat-empty" id="chatEmpty">
      <div class="icon">💬</div>
      <h3>Your Messages</h3>
      <p>Select a conversation to start chatting<br>or send an inquiry from any vehicle listing.</p>
    </div>

    <!-- Chat header (hidden initially) -->
    <div class="chat-header" id="chatHeader" style="display:none">
      <div class="chat-header-avatar" id="chatAvatarEl">?</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chatNameEl">—</div>
        <div class="chat-header-sub" id="chatSubEl">—</div>
      </div>
      <a class="chat-header-vehicle" id="chatVehicleLink" href="#" target="_blank">
        <img id="chatVehicleImg" src="" alt="" onerror="this.style.display='none'"/>
        <div class="veh-info-mini">
          <div class="veh-title" id="chatVehicleTitle">—</div>
          <div class="veh-price" id="chatVehiclePrice">—</div>
        </div>
      </a>
    </div>

    <!-- Messages area (hidden initially) -->
    <div class="chat-messages" id="chatMessages" style="display:none"></div>

    <!-- Compose (hidden initially) -->
    <div class="chat-compose" id="chatCompose" style="display:none">
      <div class="compose-input-wrap">
        <textarea id="composeText" placeholder="Type a message…" rows="1" oninput="autoResize(this)"></textarea>
      </div>
      <button class="btn-send" id="sendBtn" onclick="sendReply()">➤</button>
    </div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  const API = 'http://localhost:5000/api';
  const token = localStorage.getItem('fw_token');
  const user  = JSON.parse(localStorage.getItem('fw_user') || 'null');

  // Auth guard
  if (!token || !user) {
    window.location.href = 'login.html';
  }

  document.getElementById('navUsername').textContent = 'Hi, ' + (user?.name?.split(' ')[0] || '');

  function logout() {
    localStorage.removeItem('fw_token');
    localStorage.removeItem('fw_user');
    window.location.href = 'login.html';
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ===== STATE =====
  let allConvs = [];
  let activeConv = null;
  let pollingTimer = null;

  // ===== LOAD CONVERSATIONS =====
  async function loadConversations() {
    try {
      const res = await fetch(`${API}/messages/conversations`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) throw new Error();
      allConvs = await res.json();
      renderConvList(allConvs);
    } catch {
      document.getElementById('convList').innerHTML = `
        <div class="no-convs">
          <div class="icon">📭</div>
          <p>Could not load conversations.<br>Make sure the server is running.</p>
        </div>`;
    }
  }

  function renderConvList(convs) {
    const list = document.getElementById('convList');

    if (!convs.length) {
      list.innerHTML = `
        <div class="no-convs">
          <div class="icon">💬</div>
          <p>No conversations yet.<br>Inquire about a vehicle to start!</p>
          <a href="vehicles.html">Browse Vehicles</a>
        </div>`;
      return;
    }

    list.innerHTML = convs.map(c => {
      const other = c.otherParty;
      const initials = (other?.name || '?').charAt(0).toUpperCase();
      const timeStr = formatTime(c.lastTime);
      const hasUnread = c.unreadCount > 0;
      const isActive = activeConv && activeConv.key === c.key;

      return `
        <div class="conv-item${isActive ? ' active' : ''}" data-key="${c.key}" onclick="openConv(${JSON.stringify(c).replace(/"/g, '&quot;')})">
          <div class="conv-avatar${hasUnread ? ' has-unread' : ''}">${initials}</div>
          <div class="conv-info">
            <div class="conv-name">${esc(other?.name || 'Unknown')}</div>
            <div class="conv-vehicle">🚗 ${esc(c.vehicle?.title || 'Vehicle')}</div>
            <div class="conv-preview">${esc(c.lastMessage)}</div>
          </div>
          <div class="conv-meta">
            <div class="conv-time">${timeStr}</div>
            ${hasUnread ? `<div class="unread-badge">${c.unreadCount}</div>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  function filterConvs(q) {
    if (!q) { renderConvList(allConvs); return; }
    const filtered = allConvs.filter(c =>
      c.otherParty?.name?.toLowerCase().includes(q.toLowerCase()) ||
      c.vehicle?.title?.toLowerCase().includes(q.toLowerCase())
    );
    renderConvList(filtered);
  }

  // ===== OPEN CONVERSATION =====
  async function openConv(conv) {
    activeConv = conv;

    // Update active state in list
    document.querySelectorAll('.conv-item').forEach(el => {
      el.classList.toggle('active', el.dataset.key === conv.key);
    });

    // Show chat UI
    document.getElementById('chatEmpty').style.display = 'none';
    document.getElementById('chatHeader').style.display = 'flex';
    document.getElementById('chatMessages').style.display = 'flex';
    document.getElementById('chatCompose').style.display = 'flex';

    // Fill header
    const other = conv.otherParty;
    document.getElementById('chatAvatarEl').textContent = (other?.name || '?').charAt(0).toUpperCase();
    document.getElementById('chatNameEl').textContent = other?.name || 'Unknown';
    document.getElementById('chatSubEl').textContent = other?.email || '';

    const veh = conv.vehicle;
    document.getElementById('chatVehicleTitle').textContent = veh?.title || 'Vehicle';
    document.getElementById('chatVehiclePrice').textContent = veh?.price ? 'PKR ' + Number(veh.price).toLocaleString() : '';
    document.getElementById('chatVehicleLink').href = `vehicle-detail.html?id=${veh?._id}`;

    if (veh?.images?.length) {
      document.getElementById('chatVehicleImg').src = `${API.replace('/api','')}/${veh.images[0]}`;
      document.getElementById('chatVehicleImg').style.display = 'block';
    } else {
      document.getElementById('chatVehicleImg').style.display = 'none';
    }

    // Load thread
    await loadThread();

    // Focus compose
    document.getElementById('composeText').focus();

    // Poll for new messages
    clearInterval(pollingTimer);
    pollingTimer = setInterval(loadThread, 5000);

    // Refresh conv list to update unread counts
    loadConversations();
  }

  // ===== LOAD THREAD =====
  async function loadThread() {
    if (!activeConv) return;
    const vehId = activeConv.vehicle?._id;
    const otherId = activeConv.otherParty?._id;
    if (!vehId || !otherId) return;

    try {
      const res = await fetch(`${API}/messages/thread/${vehId}/${otherId}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) return;
      const messages = await res.json();
      renderMessages(messages);
    } catch { /* silent */ }
  }

  function renderMessages(messages) {
    const area = document.getElementById('chatMessages');
    const wasAtBottom = area.scrollHeight - area.scrollTop <= area.clientHeight + 80;

    if (!messages.length) {
      area.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;flex:1;color:var(--muted);font-size:0.85rem;">
          No messages yet. Say hello!
        </div>`;
      return;
    }

    // Group by date
    let lastDate = null;
    const rows = [];

    messages.forEach(msg => {
      const msgDate = new Date(msg.createdAt).toDateString();
      if (msgDate !== lastDate) {
        rows.push(`<div class="date-separator">${formatDate(msg.createdAt)}</div>`);
        lastDate = msgDate;
      }

      const fromMe = msg.sender._id === user.id || msg.sender._id === user._id;
      const initials = (msg.sender.name || '?').charAt(0).toUpperCase();
      const timeStr = formatTime(msg.createdAt, true);
      const readTick = fromMe && msg.isRead ? '<span class="msg-read-tick">✓✓</span>' : '';

      rows.push(`
        <div class="msg-row${fromMe ? ' from-me' : ''}">
          <div class="msg-avatar-sm">${initials}</div>
          <div class="msg-content">
            <div class="msg-bubble">${esc(msg.message)}</div>
            <div class="msg-time">${timeStr}${readTick}</div>
          </div>
        </div>
      `);
    });

    area.innerHTML = rows.join('');

    // Scroll to bottom if was at bottom
    if (wasAtBottom) area.scrollTop = area.scrollHeight;
  }

  // ===== SEND REPLY =====
  async function sendReply() {
    const text = document.getElementById('composeText').value.trim();
    if (!text || !activeConv) return;

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';

    try {
      const res = await fetch(`${API}/messages/reply`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({
          vehicleId: activeConv.vehicle?._id,
          receiverId: activeConv.otherParty?._id,
          message: text,
        }),
      });

      if (res.ok) {
        document.getElementById('composeText').value = '';
        document.getElementById('composeText').style.height = 'auto';
        await loadThread();
        loadConversations();
      } else {
        const data = await res.json();
        showToast(data.message || 'Failed to send', 'error');
      }
    } catch {
      showToast('Cannot connect to server', 'error');
    }

    btn.disabled = false;
    btn.innerHTML = '➤';
  }

  // ===== KEYBOARD SUBMIT =====
  document.getElementById('composeText').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendReply();
    }
  });

  // ===== AUTO-RESIZE TEXTAREA =====
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  // ===== HELPERS =====
  function esc(s) {
    return String(s || '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function formatTime(dateStr, showTime = false) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const now = new Date();
    const diff = now - d;
    const days = Math.floor(diff / 86400000);

    if (showTime) {
      return d.toLocaleTimeString('en-PK', { hour: '2-digit', minute: '2-digit' });
    }

    if (days === 0) return d.toLocaleTimeString('en-PK', { hour: '2-digit', minute: '2-digit' });
    if (days === 1) return 'Yesterday';
    if (days < 7) return days + 'd ago';
    return d.toLocaleDateString('en-PK', { day: 'numeric', month: 'short' });
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    const now = new Date();
    const diff = Math.floor((now - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString('en-PK', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  // ===== URL PARAM — auto-open thread =====
  const urlParams = new URLSearchParams(window.location.search);
  const autoVehicleId = urlParams.get('vehicleId');
  const autoUserId = urlParams.get('userId');

  // ===== INIT =====
  loadConversations().then(() => {
    // Auto-open if URL params provided
    if (autoVehicleId && autoUserId) {
      const match = allConvs.find(c =>
        c.vehicle?._id === autoVehicleId && c.otherParty?._id === autoUserId
      );
      if (match) openConv(match);
    }
  });
</script>
